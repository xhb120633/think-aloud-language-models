    function option_box(str, color="red"){
  		return "<div style='display: inline-block; width: 40%; margin: 1%; border: 2px solid gray; background-color: "+color+"'>"+str+"</div>";
    }
    
    function make_gamble_text(p, v){
      text = '';
      for (let i = 0; i < p.length; i++) {
        if (v[i] > 0){
          text += "Win " + "$" + v[i] + " with " + p[i] + "% chance<br>";
        }
        else{
          // x = -v[i];
          text += "Lose " + "$" + (-v[i]) + " with " + p[i] + "% chance<br>";
        }
      }
      return text;
    }

    function draw_gamble_boxes(p1, v1, p2, v2){
      textstr = "<div style='text-align:center; position: fixed; left: 50%; transform: translate(-50%, 0); bottom: 60%; width: 80%; justify-content: center;  font-family: Arial, Helvetica, sans-serif; width=500px; height=200px;'>"
      + option_box(make_gamble_text(p1, v1), 'none') 
      + option_box(make_gamble_text(p2, v2), 'none')
      +"</div>";
      return textstr
    }

      p1 = jsPsych.timelineVariable('p1',  true);

      return draw_gamble_boxes(p1, v1, p2, v2)

          + "<div>In this study we asked you to “Think Aloud” while you made a series of decisions about gambles. Our goal with this experiment is to try to understand the thought processes that arise as you make these decisions.</div>" 
          + "<div><br></div><div>The Think Aloud method is an old, but underused method in Psychology. The idea is that by asking people to voice their thoughts as they have them, we can gain insight into the cognitive processes underlying a decision. Think Aloud was first used in the 1930s and 40s to study decision making in chess players and the insights gained were quite profound as we learned that expert chess players’ thought processes are remarkably similar to novices. For example, both experts and novices make decisions by evaluating just a small number of possible futures (if I go there then you go there etc …). The difference between experts and novices is in the quality of the moves that they evaluate. Novices tend to consider moves that are unlikely to happen or are simply bad, whereas Experts are much better at considering moves that their opponent may actually make. </div>" 
          + "<div><br></div><div>In this study we are using the Think Aloud paradigm to study decisions about monetary gambles. These decisions are highly controlled and have been studied for years in the Judgment and Decision Making literature and have led to a series of mathematical models that describe how people might be making these decisions. Unfortunately, from choice data alone, it has proven difficult to tell these models apart. For example, one model assumes that people compute an average “Expected Utility” for each option – roughly corresponding to how good they think that gamble would be on average. On the other hand, another model, assumes that people make their decision using a series of heuristics, for example by comparing the relative probabilities of winning and then comparing the relative size of any possible loss. Both of these models predict choice data remarkably well and there has been a long-running debate over which model is right. The hope is that by recording people’s thoughts as they make these decisions that we will be able to distinguish the two models. For example, if people are using the Expected Utility model, we predict that they would talk about the overall value of each gamble (e.g. “The option on the left looks great, the option on the right not so much”). Conversely, if people are using the heuristic model, they may directly compare different features of the options (e.g. “left has a 50% chance of winning, but right has a higher chance, 75%”). By coding the data for these different kinds of thoughts we will test which of the two models best accounts for the Think Aloud data.</div>"
